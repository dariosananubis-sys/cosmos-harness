# COSMOS se verifica solo. Este workflow es el tercer enganche de
# spec/GUARDARRAILES.md: pre-commit (cosmos enganchar), sesión y CI.
#
# El trabajo `verificar` no tiene dependencias externas: solo la biblioteca estándar
# de Python y el checkout. Nada de pip, nada de red. Es el verde que vale para un clon.
#
# El trabajo `calibracion` instala tiktoken (software libre, sin cuenta) en un venv
# desechable y exige que las pruebas del margen NO se salten: sin él, el ±5,2 % que
# publica `cosmos medir` no lo verificaba ninguna instalación (auditoría D-08 / E-07).
name: cosmos

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0   # la comprobación de «examen quemado» necesita la historia entera (R-17)

      - name: Versión de Python (COSMOS exige 3.11+ por tomllib)
        run: |
          python3 --version
          python3 -c 'import sys; raise SystemExit(0 if sys.version_info >= (3, 11) else 1)'

      # El clon está recién bajado y la vista plana es un artefacto generado:
      # esto es exactamente lo que hace una persona al clonar el repositorio.
      - name: Arrancar la galaxia
        run: python3 -m cosmos arrancar

      - name: Arrancar el ejemplo
        run: python3 -m cosmos arrancar --config ejemplo.toml

      - name: Validar la galaxia
        run: python3 -m cosmos validar

      - name: Validar el ejemplo
        run: python3 -m cosmos validar --config ejemplo.toml

      - name: Medir el presupuesto de entrada
        run: python3 -m cosmos medir

      - name: Escanear secretos sobre los blobs versionados
        run: python3 -m puente.secretos --todo

      - name: Suite del núcleo
        run: python3 -m unittest discover -s tests -t .

      - name: Suite del puente
        run: python3 -m unittest discover -s puente/tests -t .

      # El gate es lo que corre en cada commit local. Si en CI no pasa, el hook
      # que la gente instala tampoco pasaría, y un gate que no se puede instalar
      # es el fallo que este proyecto documentó al auditar otro harness.
      - name: El gate se puede instalar y pasa
        run: python3 -m puente.gate --sin-pruebas

      # El cuarto enganche: los guardarraíles de sesión. Aquí no hay sesión de
      # agente, así que se comprueba lo comprobable — que el manejador responde
      # al evento con la decisión esperada. Que bloquee de verdad lo exigen las
      # 45 pruebas de puente/tests/test_sesion.py.
      - name: Los guardarraíles de sesión responden
        run: |
          echo '{"hook_event_name":"SessionStart","session_id":"ci","cwd":"'"$PWD"'"}' \
            | python3 -m puente.sesion | grep -q 'tokens'

  calibracion:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0   # la comprobación de «examen quemado» necesita la historia entera (R-17)

      - name: Tokenizador de referencia en un venv desechable
        run: |
          python3 -m venv .venv-calib
          .venv-calib/bin/pip install -q -r requirements-dev.txt

      - name: El margen publicado se verifica de verdad (sin saltos)
        run: COSMOS_EXIGE_TOKENIZADOR=1 .venv-calib/bin/python -m unittest discover -s tests -t .

      - name: El veredicto exacto coincide con el aproximado
        run: .venv-calib/bin/python -m cosmos medir --metodo exacto
