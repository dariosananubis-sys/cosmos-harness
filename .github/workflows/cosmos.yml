# COSMOS se verifica solo. Este workflow es el cuarto enganche de
# spec/GUARDARRAILES.md: pre-commit (cosmos enganchar), pre-push, sesión y CI.
#
# El trabajo `verificar` no tiene dependencias externas: solo la biblioteca estándar
# de Python y el checkout. Nada de pip, nada de red. Es el verde que vale para un clon.
# Corre en una matriz (revisión B-35): Linux y macOS —la plataforma de todos los pueblos
# que usan `brew`, `screencapture` o `launchd`— y con el Python MÍNIMO que el repo exige
# (3.11 por `tomllib`) además del actual, porque nadie ejecutaba nunca la suite en 3.11.
#
# El trabajo `calibracion` instala tiktoken (software libre, sin cuenta) en un venv
# desechable y exige que las pruebas del margen NO se salten: sin él, el ±5,2 % que
# publica `cosmos medir` no lo verificaba ninguna instalación (auditoría D-08 / E-07).
name: cosmos

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # la comprobación de «examen quemado» necesita la historia entera (R-17)

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Versión de Python (COSMOS exige 3.11+ por tomllib)
        run: |
          python3 --version
          python3 -c 'import sys; raise SystemExit(0 if sys.version_info >= (3, 11) else 1)'

      # El clon está recién bajado y la vista plana es un artefacto generado:
      # esto es exactamente lo que hace una persona al clonar el repositorio.
      - name: Arrancar la galaxia
        run: python3 -m cosmos arrancar

      - name: Arrancar el ejemplo
        run: python3 -m cosmos arrancar --config ejemplo.toml

      - name: Validar la galaxia
        run: python3 -m cosmos validar

      - name: Validar el ejemplo
        run: python3 -m cosmos validar --config ejemplo.toml

      - name: Medir el presupuesto de entrada
        run: python3 -m cosmos medir

      - name: Escanear secretos sobre los blobs versionados
        run: python3 -m puente.secretos --todo

      - name: Suite del núcleo
        run: python3 -m unittest discover -s tests -t .

      - name: Suite del puente
        run: python3 -m unittest discover -s puente/tests -t .

      # La garantía que el README vende: un test por invariante que la ve fallar a propósito.
      # No corría en el CI y por eso pudo degradarse de 79/79 a 76/79 sin que nada se pusiera
      # rojo (revisión B-02/B-03). Devuelve exit≠0 si una sola mutación sobrevive.
      - name: Cada invariante se ve fallar a propósito
        run: python3 -m puente.tests.mutaciones

      # El gate es lo que corre en cada commit local. Si en CI no pasa, el hook
      # que la gente instala tampoco pasaría, y un gate que no se puede instalar
      # es el fallo que este proyecto documentó al auditar otro harness.
      - name: El gate se puede instalar y pasa
        run: python3 -m puente.gate --sin-pruebas

      # El enganche de sesión. Aquí no hay sesión de agente, así que se comprueba lo
      # comprobable — que el manejador responde al evento con la decisión esperada. Que
      # bloquee de verdad lo exigen las pruebas de puente/tests/test_sesion.py.
      - name: Los guardarraíles de sesión responden
        run: |
          echo '{"hook_event_name":"SessionStart","session_id":"ci","cwd":"'"$PWD"'"}' \
            | python3 -m puente.sesion | grep -q 'tokens'

      # El alta de máquina no escribe en el runner: solo se comprueba que responde y que el
      # inventario es trivalente (nunca «ok» por no haber podido mirar).
      - name: El alta de máquina responde en seco
        run: |
          python3 -m cosmos configurar --autonomia
          python3 -m cosmos configurar --autonomia libre --seco
          python3 -m cosmos configurar --modelos estado
          python3 -m cosmos estado --maquina --json | python3 -c 'import json,sys; filas=json.load(sys.stdin); assert any(f["estado"]=="no_comprobado" for f in filas), filas'

      # Cuando exista el holdout v2 ciego (PENDIENTE-DARIO §6) se descomenta y el CI cobra
      # listón; hasta entonces `cosmos acertar --minimo` sale 1 a propósito (revisión B-36).
      # - name: El catálogo lleva a la herramienta correcta al menos N de cada 100 veces
      #   run: python3 -m cosmos acertar --minimo 60

  calibracion:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # la comprobación de «examen quemado» necesita la historia entera (R-17)

      - name: Tokenizador de referencia en un venv desechable
        run: |
          python3 -m venv .venv-calib
          .venv-calib/bin/pip install -q -r requirements-dev.txt

      - name: El margen publicado se verifica de verdad (sin saltos)
        run: COSMOS_EXIGE_TOKENIZADOR=1 .venv-calib/bin/python -m unittest discover -s tests -t .

      - name: El veredicto exacto coincide con el aproximado
        run: .venv-calib/bin/python -m cosmos medir --metodo exacto
