# Configuración del árbol real (la galaxia), separada de la del ejemplo.
#
# Por qué existe este fichero y no basta cosmos.toml: 'destino' y 'manifiesto' son
# globales, así que dos árboles en el mismo repo se pisan la vista plana. Medido el
# 2026-09-01: compilar la galaxia dejó el ejemplo con 68 errores y 3 tests en rojo.
# Fallo de spec (NUCLEO §8), no del código. Arreglo de fondo pendiente: derivar el
# manifiesto de la raíz del árbol en vez de fijarlo en configuración.

[presupuesto]
entrada = 4000
resumen = 120
oceanos = 7
galaxia_lineas = 40
solapamiento = 0.25

[raiz]
arbol = "galaxia"
indice = "galaxia/COSMOS.md"

[medicion]
metodo = "aprox"

[compilacion]
destino = ".cosmos/vista-galaxia"
modo = "symlink"
manifiesto = ".cosmos/compilado-galaxia.json"
